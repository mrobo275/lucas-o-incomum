const ST=[
{id:'roanoke',t:'A colônia perdida de Roanoke',sub:'Cem pessoas e uma palavra gravada num poste',cat:'casos',cl:'caso',y:1590,yl:'1590',d:'2026-10-26',ed:'2026-10',f:1,tg:['colonização','desaparecimento'],b:['Em 1587, cerca de 115 colonos ingleses chegaram à ilha de Roanoke, no litoral da atual Carolina do Norte, liderados por John White.','## O retorno','White voltou à Inglaterra para buscar suprimentos e só conseguiu retornar em 1590, atrasado pela guerra entre Inglaterra e Espanha. Ao chegar, encontrou o povoado desmontado, sem sinais de luta, e a palavra "CROATOAN" gravada em um poste.','## Versões e divergências','Uma hipótese é que os colonos tenham se mudado para a ilha de Croatoan ou se juntado a povos vizinhos. Não há prova definitiva, e pesquisas arqueológicas continuam. O que está documentado é o abandono do povoado e a inscrição; o destino dos colonos permanece em aberto.']},
{id:'mary-celeste',t:'Dossiê: o navio Mary Celeste',sub:'Encontrado à deriva, sem ninguém a bordo',cat:'docs',cl:'doc',y:1872,yl:'1872',d:'2026-10-22',ed:'2026-10',f:0,tg:['navio','mar'],b:['O Mary Celeste partiu de Nova York em 7 de novembro de 1872 rumo a Gênova, com o capitão Benjamin Briggs, a tripulação e a carga.','## O achado','Em 4 de dezembro de 1872, o navio Dei Gratia o encontrou à deriva no Atlântico. Não havia ninguém a bordo, e o bote salva-vidas não estava lá. Segundo os relatos, o navio estava em condições de navegar.','## Hipóteses','Foram propostas várias explicações, como medo de uma explosão por causa da carga ou problemas de navegação. Nenhuma foi comprovada. O destino da tripulação é desconhecido.']},
{id:'curupira',t:'Curupira, o guardião da mata',sub:'O ser de pés virados para trás',cat:'lendas',cl:'lenda',y:null,yl:'tradição',d:'2026-10-19',ed:'2026-10',f:0,tg:['folclore','floresta'],b:['O Curupira é uma figura do folclore brasileiro, de origem ligada a tradições indígenas, descrita como protetora das matas e dos animais.','## A imagem','A tradição diz que ele tem os pés virados para trás, o que confunde quem tenta seguir suas pegadas. Nas histórias, castiga quem caça ou desmata sem necessidade.','## Aviso','Trata-se de lenda e folclore, não de fato comprovado. Existem versões diferentes de região para região.']},
{id:'ultima-parada',t:'A última parada',sub:'Um conto original de suspense',cat:'terror',cl:'ficcao',y:null,yl:'ficção',d:'2026-10-17',ed:'2026-10',f:0,tg:['conto','suspense'],b:['Nina pegou o último ônibus da madrugada, como fazia há anos. Naquela noite, porém, o motorista não respondeu ao cumprimento.','## O trajeto','As paradas foram passando sem ninguém subir. Na janela, as ruas pareciam as mesmas, mas as placas tinham nomes que ela nunca tinha lido. Quando o ônibus freou, o motorista apontou a porta sem se virar.','## O fim da linha','Ela desceu na frente de sua própria casa, com a luz da sala acesa. Lá dentro, alguém acenava para ela da janela. Nina nunca soube quem era.','Esta é uma obra de ficção original, escrita para demonstração.']},
{id:'marfa',t:'As luzes de Marfa',sub:'Luzes no deserto do Texas',cat:'misterios',cl:'relato',y:null,yl:'relatos',d:'2026-10-14',ed:'2026-10',f:0,tg:['luzes','Texas'],b:['Perto da cidade de Marfa, no Texas, circulam há décadas relatos de luzes que aparecem e desaparecem no deserto à noite.','## O que se diz','Os relatos variam e muitos dependem do testemunho de visitantes. Por isso, a história é classificada aqui como relato não confirmado.','## Explicações propostas','Algumas investigações apontam que parte das luzes observadas pode vir de faróis de veículos a distância. O assunto continua sendo discutido.']},
{id:'pripyat',t:'Pripyat, a cidade abandonada',sub:'Um lugar parado no tempo desde 1986',cat:'lugares',cl:'fato',y:1986,yl:'1986',d:'2026-09-28',ed:'2026-09',f:0,tg:['abandono','Chernobyl'],b:['Pripyat foi fundada em 1970 para abrigar trabalhadores da usina nuclear de Chernobyl, na atual Ucrânia.','## A evacuação','Após o acidente de 26 de abril de 1986, a cidade foi evacuada em 27 de abril. Dezenas de milhares de moradores deixaram suas casas.','## Hoje','Pripyat fica dentro de uma zona de exclusão e permanece abandonada. Edifícios e objetos deixados para trás tornaram o local um símbolo do acidente.']},
{id:'voynich',t:'O manuscrito Voynich',sub:'Um livro que ninguém consegue ler',cat:'misterios',cl:'caso',y:1420,yl:'séc. XV',d:'2026-09-24',ed:'2026-09',f:0,tg:['manuscrito','códigos'],b:['O manuscrito Voynich é um livro ilustrado, escrito em uma escrita que nunca foi decifrada, hoje guardado na Biblioteca Beinecke, da Universidade Yale.','## O que se sabe','Análises de datação por radiocarbono indicam que o pergaminho é do início do século XV. O nome vem de Wilfrid Voynich, que o adquiriu em 1912. As ilustrações mostram plantas, figuras e diagramas.','## O que não se sabe','Ninguém decifrou o texto de forma aceita por especialistas. Há teorias sobre código, língua desconhecida ou texto sem sentido, mas nenhuma está comprovada.']},
{id:'tunguska',t:'A explosão de Tunguska',sub:'Uma floresta derrubada na Sibéria',cat:'misterios',cl:'fato',y:1908,yl:'1908',d:'2026-09-21',ed:'2026-09',f:0,tg:['Sibéria','explosão'],b:['Em 30 de junho de 1908, uma grande explosão ocorreu sobre uma região remota da Sibéria, na Rússia.','## O efeito','Estimativas indicam que a explosão derrubou árvores em uma área de cerca de 2 mil quilômetros quadrados. Não foi encontrada uma cratera clássica de impacto.','## A explicação mais aceita','O consenso científico é que um asteroide ou fragmento de cometa explodiu no ar. Detalhes, como tamanho e composição, ainda são discutidos.']},
{id:'peste-negra',t:'A Peste Negra',sub:'A pandemia que marcou a Europa medieval',cat:'historia',cl:'fato',y:1347,yl:'1347',d:'2026-09-18',ed:'2026-09',f:0,tg:['pandemia','Idade Média'],b:['Entre 1347 e 1351, uma pandemia de peste atingiu a Europa, chegando por rotas de comércio no Mediterrâneo.','## Impacto','As estimativas de mortes variam bastante entre os estudiosos, mas apontam para uma parcela muito grande da população europeia.','## A causa','A doença é associada à bactéria Yersinia pestis. O episódio mudou a economia, a sociedade e a vida cotidiana da época.']},
{id:'boitata',t:'Boitatá, a cobra de fogo',sub:'A lenda que protege os campos',cat:'brasil',cl:'lenda',y:null,yl:'tradição',d:'2026-09-12',ed:'2026-09',f:0,tg:['folclore','fogo'],b:['O Boitatá é uma lenda brasileira, de origem ligada a tradições indígenas, que fala de uma cobra de fogo.','## Nas histórias','Em muitas versões, ele protege campos e matas de quem os incendeia. O nome é associado a palavras de origem tupi que remetem à ideia de cobra de fogo.','## Aviso','É lenda e folclore, e não fato comprovado. As versões mudam conforme a região.']}];

$('#sh').onclick=async()=>{const u=location.href.split('#')[0]+'#s-'+s.id;try{if(navigator.share)await navigator.share({title:s.t,url:u});else{await navigator.clipboard.writeText(u);$('#sh').textContent='Link copiado'}}catch(e){$('#sh').textContent='Copie o endereço'}}}
let fq='',fc='',fk='',fm='';
function files(){const t=fq.toLowerCase();$('#m').innerHTML=`<h1 class="ttl">Arquivo completo</h1><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px"><input class="in" id="qi" value="${esc(fq)}" placeholder="Título, palavra-chave ou assunto" style="flex:1;min-width:200px"><select id="qc"><option value="">Categoria</option>${Object.entries(CAT).map(([k,v])=>`<option value="${k}" ${fc===k?'selected':''}>${v}</option>`).join('')}</select><select id="qk"><option value="">Classificação</option>${Object.entries(CL).map(([k,v])=>`<option value="${k}" ${fk===k?'selected':''}>${v}</option>`).join('')}</select><select id="qm"><option value="">Mês</option>${Object.entries(ED).map(([k,v])=>`<option value="${k}" ${fm===k?'selected':''}>${v.t}</option>`).join('')}</select></div><div id="fl"></div>`;
const run=()=>{const t=fq.toLowerCase(),l=by(s=>(!fc||s.cat===fc)&&(!fk||s.cl===fk)&&(!fm||s.ed===fm)&&(!t||[s.t,s.sub,CAT[s.cat],CL[s.cl],s.yl,...s.tg,...s.b].join(' ').toLowerCase().includes(t)));
$('#fl').innerHTML=l.length?l.map(s=>`<a class="row" href="#s-${s.id}"><span class="n">${no(s)}</span><span><b class="tp" style="font-size:19px">${esc(s.t)}</b><br><span class="mu">${CAT[s.cat]} · ${CL[s.cl]} · ${dt(s.d)}</span></span></a>`).join(''):'<p class="mu">Nenhum arquivo encontrado.</p>'};
$('#qi').oninput=e=>{fq=e.target.value;run()};[['qc',v=>fc=v],['qk',v=>fk=v],['qm',v=>fm=v]].forEach(([i,f])=>$('#'+i).onchange=e=>{f(e.target.value);run()});run()}
function gal(){$('#m').innerHTML=`<h1 class="ttl">Galeria sombria</h1><p class="mu" style="text-align:center;margin-bottom:24px">Ilustrações originais do arquivo. Nenhuma delas é fotografia real dos acontecimentos.</p><div class="g">${ST.map(pl).join('')}</div>`}
function timeline(){const l=[...ST].filter(s=>s.y!=null).sort((a,b)=>a.y-b.y);$('#m').innerHTML=`<h1 class="ttl">Linha do tempo</h1><div class="tl">${l.map(s=>`<a href="#s-${s.id}"><b>${esc(s.yl)}</b><div class="tp" style="font-size:20px">${esc(s.t)}</div><div class="mu">${CAT[s.cat]} · ${CL[s.cl]}</div></a>`).join('')}</div><p class="mu">Lendas e ficções não entram na linha do tempo.</p>`}
function editions(){$('#m').innerHTML=`<h1 class="ttl">Arquivo mensal</h1><div class="g">${Object.entries(ED).sort().reverse().map(([k,e])=>`<a class="pl" href="#ed-${k}"><div style="background:#151515;aspect-ratio:1/.95;display:flex;align-items:center;justify-content:center;color:var(--rd);font-family:'Special Elite',monospace;font-size:24px;text-align:center;padding:10px">${e.t.toUpperCase()}</div><div class="c">${e.s}</div></a>`).join('')}</div>`}
function edp(k){const e=ED[k];$('#m').innerHTML=`<h1 class="ttl">${e.t}</h1><p class="mu" style="text-align:center;margin-bottom:24px">${e.s}</p><div class="g">${by(s=>s.ed===k).map(pl).join('')}</div>`}
function favs(){const l=by(s=>FV.includes(s.id));$('#m').innerHTML=`<h1 class="ttl">Favoritos</h1>${l.length?`<div class="g">${l.map(pl).join('')}</div>`:'<p class="mu" style="text-align:center">Nada salvo ainda. Os favoritos ficam neste navegador.</p>'}`}
function about(){$('#m').innerHTML=`<div class="art"><h1>Sobre o arquivo</h1><p>O Lucas o Incomum reúne casos reais, mistérios, histórias sombrias, lendas e ficção. Cada publicação tem uma classificação clara: fato documentado, caso não solucionado, relato não confirmado, lenda e folclore, ficção de terror ou documentário.</p><h2>Compromisso</h2><p>Lendas não são apresentadas como fatos. Fontes não são inventadas. Quando há versões diferentes de um episódio, elas são indicadas.</p><h2>Nesta versão</h2><p>As histórias são exemplos demonstrativos e as imagens são ilustrações originais. O painel para publicar conteúdo real e o envio de entradas serão a próxima etapa.</p></div>`}
addEventListener('hashchange',route);route();
</script></body></html>
